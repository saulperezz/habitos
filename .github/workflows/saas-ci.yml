name: saas-ci

on:
  push:
    paths: ['saas/**', '.github/workflows/saas-ci.yml']
  pull_request:
    paths: ['saas/**', '.github/workflows/saas-ci.yml']

concurrency:
  group: saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
